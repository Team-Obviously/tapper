[profile.default]
src = "."
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = true
verbosity = 2

[profile.default.eth_rpc_urls]
sepolia = "https://sepolia.infura.io/v3/${INFURA_API_KEY}"
celo_sepolia = "https://celo-sepolia.infura.io/v3/${INFURA_API_KEY}"

[profile.default.etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}" }
celo_sepolia = { key = "${CELOSCAN_API_KEY}" }

[profile.default.env]
PRIVATE_KEY = "${PRIVATE_KEY}"
HUB_ADDRESS = "${HUB_ADDRESS}"
SCOPE_SEED = "${SCOPE_SEED}"

# Self Protocol contracts
remappings = [
    "@selfxyz/contracts/=lib/self-contracts/contracts/"
]

# Dependencies
dependencies = [
    "https://github.com/selfxyz/self-contracts.git"
]
