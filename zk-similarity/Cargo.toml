[package]
name = "zk-similarity-service"
version = "0.1.0"
edition = "2021"

[dependencies]
# Mopro dependencies for ZK proving
mopro-ffi = { git = "https://github.com/zkmopro/mopro.git", features = ["circom"] }
circom-prover = { git = "https://github.com/zkmopro/mopro.git" }

# Web service dependencies
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Cryptography
sha2 = "0.10"
hex = "0.4"
rand = "0.8"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Database (for storing commitments and proofs)
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tokio-test = "0.4"